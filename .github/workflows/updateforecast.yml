name: Automatic Kronos Forecast

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout Current Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url pytorch.org
        pip install transformers pandas numpy matplotlib requests ccxt einops accelerating

    - name: Run Prediction Script
      run: |
        python update_predictions.py

    - name: Commit and Push Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@github.com"
        git add index.html prediction_chart.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update forecast [skip ci]" && git push)
